<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Compound Harvest 1 · v0.01</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #1b3b1b;
      background-image: radial-gradient(circle at 20% 30%, #2e5e2e, #0f1f0f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }

    .game-container {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 100dvh;
      background: #1e2b1e;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
      border-radius: 0;
      overflow: hidden;
      position: relative;
    }

    /* header / status */
    .status-bar {
      background: #0f1a0f;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e0f0d0;
      border-bottom: 2px solid #3a6b3a;
      flex-wrap: wrap;
      gap: 8px;
    }

    .currency {
      display: flex;
      gap: 16px;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .currency span {
      background: #1d2e1d;
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid #4f7a4f;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .points {
      background: #2a3f2a;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
      border: 1px solid #6f9e6f;
    }

    /* Main content */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 80px;
      display: flex;
      flex-direction: column;
      scroll-behavior: smooth;
    }

    .page {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .page.active {
      display: flex;
    }

    /* Kartu pohon */
    .tree-card {
      background: #1b2e1b;
      border-radius: 32px;
      padding: 24px 16px;
      box-shadow: inset 0 0 0 2px #3a613a, 0 12px 20px -8px black;
      text-align: center;
    }

    .tree-icon {
      font-size: 4.2rem;
      line-height: 1;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5));
      margin-bottom: 8px;
    }

    .level-badge {
      background: #2c4a2c;
      padding: 6px 16px;
      border-radius: 40px;
      display: inline-block;
      font-weight: 700;
      color: #d4f0c0;
      margin-bottom: 8px;
      border: 1px solid #7fb07f;
      font-size: 1.1rem;
    }

    .exp-bar-container {
      width: 100%;
      background: #0c180c;
      height: 20px;
      border-radius: 30px;
      margin: 12px 0 8px;
      overflow: hidden;
      border: 1px solid #4a704a;
    }

    .exp-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #9fdf4f, #4caf50);
      border-radius: 30px;
      transition: width 0.2s ease;
    }

    .exp-text {
      font-size: 0.9rem;
      color: #b0d0a0;
    }

    .reward-badge {
      background: #3d5e3d;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #ffffc0;
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Tombol aksi */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .btn {
      background: #2d4a2d;
      border: none;
      padding: 16px 8px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #ecffe2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 0 #0f1f0f, 0 6px 12px rgba(0, 0, 0, 0.5);
      transition: all 0.05s ease;
      cursor: pointer;
      border: 1px solid #6a9e6a;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 #0f1f0f, 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .btn:disabled {
      opacity: 0.4;
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f1f0f;
      pointer-events: none;
    }

    .btn-primary {
      background: #4a7a4a;
      box-shadow: 0 6px 0 #1e3a1e, 0 6px 12px black;
    }

    .btn-harvest {
      background: #c9a23f;
      color: #1e2b0e;
      border-color: #f5e56b;
      grid-column: span 2;
      font-size: 1.3rem;
      box-shadow: 0 6px 0 #7a5e1e;
    }

    /* Toko */
    .shop-item {
      background: #1e2f1e;
      border-radius: 20px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #497049;
      box-shadow: 0 4px 0 #0a130a;
      margin-bottom: 10px;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-name {
      font-weight: 700;
      color: #e0f0d0;
      font-size: 1.05rem;
    }

    .item-price {
      font-size: 0.9rem;
      color: #b8d8a8;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .buy-btn {
      background: #426842;
      border: none;
      padding: 10px 18px;
      border-radius: 40px;
      font-weight: 700;
      color: #e9ffe0;
      box-shadow: 0 4px 0 #183018;
      border: 1px solid #84b084;
      cursor: pointer;
      touch-action: manipulation;
      font-size: 0.95rem;
    }

    .buy-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #183018;
    }

    .buy-btn:disabled {
      opacity: 0.4;
      transform: translateY(2px);
      box-shadow: 0 2px 0 #183018;
      pointer-events: none;
    }

    /* Inventory mini */
    .inventory-row {
      display: flex;
      gap: 12px;
      background: #162316;
      padding: 10px 16px;
      border-radius: 50px;
      justify-content: space-around;
      font-weight: 600;
      color: #d0e8c0;
      border: 1px solid #527a52;
    }

    /* Navigasi bawah */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #0f1a0f;
      display: flex;
      border-top: 2px solid #3f6b3f;
      padding: 6px 0;
      padding-bottom: max(6px, env(safe-area-inset-bottom));
      z-index: 10;
    }

    .nav-item {
      flex: 1;
      background: transparent;
      border: none;
      color: #8aa88a;
      font-weight: 600;
      padding: 12px 0;
      font-size: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: 0.1s;
      touch-action: manipulation;
    }

    .nav-item.active {
      color: #d4f0b0;
      background: #1e2f1e;
      border-radius: 20px;
      margin: 0 4px;
    }

    .nav-icon {
      font-size: 1.5rem;
    }

    /* Modal & profile */
    .profile-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e2f1e;
      border-radius: 50px;
      padding: 8px 16px;
      border: 1px solid #5b875b;
      margin-bottom: 8px;
    }

    .profile-name {
      color: #e0f0d0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .edit-btn {
      background: #3b5e3b;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      border: 1px solid #7fa07f;
    }

    /* notifikasi toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #2d4a2d;
      color: #f0ffe0;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      box-shadow: 0 8px 20px black;
      border: 1px solid #a0d0a0;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    .toast.show {
      opacity: 1;
    }

    /* util */
    .hidden {
      display: none !important;
    }

    .text-gold {
      color: #ffd966;
    }

    .text-diamond {
      color: #a0e0ff;
    }

    .small-note {
      font-size: 0.75rem;
      color: #8fa88f;
      text-align: center;
      margin-top: 6px;
    }

    /* scrollbar */
    main::-webkit-scrollbar {
      width: 4px;
    }

    main::-webkit-scrollbar-thumb {
      background: #4a704a;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="game-container" id="gameContainer">
  <!-- Status bar -->
  <div class="status-bar">
    <div class="currency">
      <span>💰 $<span id="moneyDisplay">1500</span></span>
      <span>💎 <span id="diamondDisplay">0</span></span>
    </div>
    <div class="points" id="planterPointsDisplay">🌱 0 PP</div>
  </div>

  <!-- MAIN -->
  <main id="mainContent">
    <!-- TANAM PAGE -->
    <div id="pageTanam" class="page active">
      <div class="tree-card">
        <div class="tree-icon" id="treeIcon">🌰</div>
        <div class="level-badge" id="levelBadge">Lv.1 Benih</div>
        <div class="exp-bar-container">
          <div class="exp-fill" id="expFill" style="width: 0%;"></div>
        </div>
        <div class="exp-text" id="expText">0 / 499 Exp</div>
        <div class="reward-badge" id="rewardPreview">🎁 $5.000 · 💧1000 · 💎30 · 50 PP</div>
      </div>

      <div class="inventory-row">
        <span>💧 <span id="waterDisplay">0</span> L</span>
        <span>🧪 <span id="fertilizerDisplay">0</span> kg</span>
      </div>

      <div class="action-grid">
        <button class="btn" id="waterBtn">💧 Siram (1L)</button>
        <button class="btn" id="fertilizeBtn">🧪 Beri Pupuk (1kg)</button>
        <button class="btn btn-harvest hidden" id="harvestBtn" style="grid-column: span 2;">🎁 PANEN</button>
      </div>
      <div class="small-note" id="pupukNote">Beri pupuk tiap 10 siram agar efek tetap 10 exp/L</div>
    </div>

    <!-- TOKO PAGE -->
    <div id="pageToko" class="page">
      <h3 style="color:#c0e0b0; margin-bottom: 8px;">🛒 Toko</h3>
      <div id="shopItemsContainer"></div>
    </div>

    <!-- AKUN PAGE -->
    <div id="pageAkun" class="page">
      <div class="profile-row">
        <div class="profile-name">👤 <span id="profileName">Petani</span></div>
        <button class="edit-btn" id="editNameBtn">✏️ Edit</button>
      </div>
      <div class="small-note" style="margin-top: 20px;">Compound Harvest 1 · v0.01</div>
    </div>
  </main>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-item active" data-page="tanam"><span class="nav-icon">🌳</span>Tanam</button>
    <button class="nav-item" data-page="toko"><span class="nav-icon">🛒</span>Toko</button>
    <button class="nav-item" data-page="akun"><span class="nav-icon">👤</span>Akun</button>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script>
  (function() {
    // ========== STATE ==========
    const state = {
      money: 1500,
      diamond: 0,
      planterPoints: 0,
      water: 0,          // liter
      fertilizer: 0,     // kg
      exp: 0,
      level: 1,          // 1-5
      name: 'Petani',
      // mekanisme pupuk: penghitung siram sejak pupuk terakhir
      waterSinceFertilizer: 0,
      skipUsedThisLevel: false,   // batas skip 1x per level
    };

    // Level thresholds
    const LEVELS = [
      { level: 1, name: 'Benih', min: 0, max: 499 },
      { level: 2, name: 'Kecambah', min: 500, max: 1499 },
      { level: 3, name: 'Semai', min: 1500, max: 2499 },
      { level: 4, name: 'Pohon Muda', min: 2500, max: 2999 },
      { level: 5, name: 'Pohon Dewasa', min: 3000, max: 3000 } // max sama utk panen
    ];

    // ========== DOM ==========
    const moneyDisplay = document.getElementById('moneyDisplay');
    const diamondDisplay = document.getElementById('diamondDisplay');
    const planterPointsDisplay = document.getElementById('planterPointsDisplay');
    const treeIcon = document.getElementById('treeIcon');
    const levelBadge = document.getElementById('levelBadge');
    const expFill = document.getElementById('expFill');
    const expText = document.getElementById('expText');
    const waterDisplay = document.getElementById('waterDisplay');
    const fertilizerDisplay = document.getElementById('fertilizerDisplay');
    const waterBtn = document.getElementById('waterBtn');
    const fertilizeBtn = document.getElementById('fertilizeBtn');
    const harvestBtn = document.getElementById('harvestBtn');
    const rewardPreview = document.getElementById('rewardPreview');
    const pupukNote = document.getElementById('pupukNote');
    const shopItemsContainer = document.getElementById('shopItemsContainer');
    const profileName = document.getElementById('profileName');
    const editNameBtn = document.getElementById('editNameBtn');
    const pageTanam = document.getElementById('pageTanam');
    const pageToko = document.getElementById('pageToko');
    const pageAkun = document.getElementById('pageAkun');
    const navItems = document.querySelectorAll('.nav-item');
    const toastEl = document.getElementById('toast');

    // ========== UTILS ==========
    function showToast(msg, duration = 1800) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), duration);
    }

    // Format angka
    function formatNumber(num) {
      return num.toLocaleString('id-ID');
    }

    // Dapatkan data level berdasarkan exp
    function getLevelData(exp) {
      if (exp >= 3000) return LEVELS[4];
      for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (exp >= LEVELS[i].min) return LEVELS[i];
      }
      return LEVELS[0];
    }

    // Update UI berdasarkan state
    function updateUI() {
      // currencies
      moneyDisplay.textContent = formatNumber(state.money);
      diamondDisplay.textContent = state.diamond;
      planterPointsDisplay.textContent = `🌱 ${formatNumber(state.planterPoints)} PP`;

      // inventory
      waterDisplay.textContent = state.water;
      fertilizerDisplay.textContent = state.fertilizer;

      // level & exp
      const currentLevelData = getLevelData(state.exp);
      state.level = currentLevelData.level;

      // jika level 5, exp mentok 3000
      if (state.level === 5) {
        state.exp = Math.min(state.exp, 3000);
      }

      // tree icon & badge
      const icons = ['🌰', '🌱', '🌿', '🌳', '🌲'];
      treeIcon.textContent = icons[state.level - 1] || '🌰';

      levelBadge.textContent = `Lv.${state.level} ${currentLevelData.name}`;

      // progress bar
      let percentage = 0;
      if (state.level === 5) {
        percentage = 100;
        expText.textContent = `3000 / 3000 Exp (Siap panen)`;
      } else {
        const min = currentLevelData.min;
        const max = currentLevelData.max;
        const range = max - min + 1;
        const currentInLevel = state.exp - min;
        percentage = Math.min(100, (currentInLevel / range) * 100);
        expText.textContent = `${state.exp} / ${max} Exp`;
      }
      expFill.style.width = percentage + '%';

      // tombol panen: hanya muncul jika level 5
      if (state.level === 5) {
        harvestBtn.classList.remove('hidden');
      } else {
        harvestBtn.classList.add('hidden');
      }

      // disable tombol jika tidak punya item
      waterBtn.disabled = state.water < 1;
      fertilizeBtn.disabled = state.fertilizer < 1;

      // note pupuk
      if (state.waterSinceFertilizer >= 10) {
        pupukNote.textContent = '⚠️ Pupuk habis! Efek air hanya +5 exp/L. Beri pupuk!';
        pupukNote.style.color = '#f0b060';
      } else {
        pupukNote.textContent = `Beri pupuk tiap 10 siram (${state.waterSinceFertilizer}/10)`;
        pupukNote.style.color = '#8fa88f';
      }

      // Refresh toko (untuk disabled / harga diamond dll)
      renderShop();

      // Update profile name
      profileName.textContent = state.name;
    }

    // ========== TREE MECHANICS ==========
    function addExp(amount) {
      if (state.level === 5) {
        // sudah panen, tidak bisa tambah exp
        return;
      }
      const maxExp = 3000;
      state.exp = Math.min(state.exp + amount, maxExp);
      // cek level up
      const newLevel = getLevelData(state.exp).level;
      if (newLevel > state.level) {
        state.level = newLevel;
        state.skipUsedThisLevel = false; // reset batas skip per level
        showToast(`🌟 Naik ke Lv.${state.level} ${getLevelData(state.exp).name}!`);
      }
      updateUI();
    }

    // Watering
    function waterTree() {
      if (state.water < 1) {
        showToast('💧 Air habis! Beli di toko.');
        return;
      }
      if (state.level === 5) {
        showToast('Pohon sudah dewasa, panen dulu!');
        return;
      }

      // konsumsi 1 liter
      state.water -= 1;

      // hitung exp: dasar 10, tapi jika waterSinceFertilizer >= 10 maka hanya 5
      let expGain = 10;
      if (state.waterSinceFertilizer >= 10) {
        expGain = 5; // efek pupuk hilang
      }
      // tambah exp
      addExp(expGain);

      // increment waterSinceFertilizer (hanya jika belum mencapai 10? kita biarkan naik, tapi efeknya tetap 10/5)
      // pupuk akan mereset menjadi 0
      if (state.waterSinceFertilizer < 10) {
        state.waterSinceFertilizer += 1;
      } else {
        // tetap 10, tidak perlu naik terus
        state.waterSinceFertilizer = 10;
      }

      updateUI();
      showToast(`💧 +${expGain} Exp (${state.waterSinceFertilizer}/10)`);
    }

    // Fertilize
    function fertilizeTree() {
      if (state.fertilizer < 1) {
        showToast('🧪 Pupuk habis! Beli di toko.');
        return;
      }
      if (state.level === 5) {
        showToast('Pohon sudah dewasa, tidak perlu pupuk.');
        return;
      }

      state.fertilizer -= 1;
      // efek pupuk: +5 exp langsung dan reset hitungan siram
      addExp(5);
      state.waterSinceFertilizer = 0; // reset, efek air kembali 10
      updateUI();
      showToast('🧪 +5 Exp, efek air kembali normal (10/L)');
    }

    // Harvest
    function harvest() {
      if (state.level !== 5) {
        showToast('Pohon belum siap panen.');
        return;
      }
      // Beri hadiah
      state.money += 5000;
      state.water += 1000;
      state.diamond += 30;
      state.planterPoints += 50;

      // Reset pohon ke level 1
      state.exp = 0;
      state.level = 1;
      state.waterSinceFertilizer = 0;
      state.skipUsedThisLevel = false;

      updateUI();
      showToast('🎉 Panen berhasil! +$5.000, +1000L air, +30💎, +50PP');
    }

    // ========== SHOP ==========
    const shopCatalog = [
      { id: 'water5', name: '💧 Air 5 Liter', priceMoney: 250, priceDiamond: null, type: 'water', amount: 5 },
      { id: 'water10', name: '💧 Air 10 Liter', priceMoney: 400, priceDiamond: null, type: 'water', amount: 10 },
      { id: 'water20', name: '💧 Air 20 Liter', priceMoney: 1000, priceDiamond: 5, type: 'water', amount: 20 },
      { id: 'fert1', name: '🧪 Pupuk 1 Kg', priceMoney: 300, priceDiamond: null, type: 'fertilizer', amount: 1 },
      { id: 'fert5', name: '🧪 Pupuk 5 Kg', priceMoney: 900, priceDiamond: 5, type: 'fertilizer', amount: 5 },
      { id: 'fert12', name: '🧪 Pupuk 12 Kg', priceMoney: 1400, priceDiamond: 10, type: 'fertilizer', amount: 12 },
      { id: 'fert20', name: '🧪 Pupuk 20 Kg', priceMoney: 6000, priceDiamond: 15, type: 'fertilizer', amount: 20 },
      { id: 'instant', name: '✨ Instant Grow (+500 exp)', priceDiamond: 25, type: 'instant' },
      { id: 'skip', name: '⏩ Skip Level (naik 1 level)', priceDiamond: 100, type: 'skip', limitPerLevel: true },
    ];

    function renderShop() {
      let html = '';
      shopCatalog.forEach(item => {
        const canBuyMoney = item.priceMoney !== undefined && state.money >= item.priceMoney;
        const canBuyDiamond = item.priceDiamond !== undefined && state.diamond >= item.priceDiamond;

        // Skip level hanya bisa jika belum digunakan di level ini dan level <5
        let skipDisabled = false;
        if (item.type === 'skip') {
          skipDisabled = state.skipUsedThisLevel || state.level >= 5;
        }

        const disabled = (item.priceMoney !== undefined && item.priceDiamond !== undefined)
          ? (!canBuyMoney && !canBuyDiamond) || skipDisabled
          : (item.priceMoney !== undefined ? !canBuyMoney : !canBuyDiamond) || skipDisabled;

        // Format harga
        let priceHtml = '';
        if (item.priceMoney && item.priceDiamond) {
          priceHtml = `$${formatNumber(item.priceMoney)} / 💎${item.priceDiamond}`;
        } else if (item.priceMoney) {
          priceHtml = `$${formatNumber(item.priceMoney)}`;
        } else if (item.priceDiamond) {
          priceHtml = `💎${item.priceDiamond}`;
        }

        html += `
          <div class="shop-item">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">${priceHtml}</div>
            </div>
            <button class="buy-btn" data-id="${item.id}" ${disabled ? 'disabled' : ''}>Beli</button>
          </div>
        `;
      });
      shopItemsContainer.innerHTML = html;

      // Event listener untuk tombol beli
      document.querySelectorAll('.buy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = e.currentTarget.dataset.id;
          buyItem(id);
        });
      });
    }

    function buyItem(id) {
      const item = shopCatalog.find(i => i.id === id);
      if (!item) return;

      // Cek batasan skip
      if (item.type === 'skip') {
        if (state.skipUsedThisLevel) {
          showToast('⏩ Skip level sudah dipakai di level ini.');
          return;
        }
        if (state.level >= 5) {
          showToast('Pohon sudah dewasa, tidak bisa skip.');
          return;
        }
      }

      // Tentukan mata uang: prioritas money jika ada dan cukup? Kita buat pemain pilih? di sini kita pakai money dulu jika ada
      let paid = false;
      if (item.priceMoney !== undefined && state.money >= item.priceMoney) {
        state.money -= item.priceMoney;
        paid = true;
      } else if (item.priceDiamond !== undefined && state.diamond >= item.priceDiamond) {
        state.diamond -= item.priceDiamond;
        paid = true;
      } else {
        showToast('❌ Saldo tidak cukup!');
        return;
      }

      if (!paid) return;

      // Efek item
      switch (item.type) {
        case 'water':
          state.water += item.amount;
          showToast(`💧 +${item.amount} Liter air`);
          break;
        case 'fertilizer':
          state.fertilizer += item.amount;
          showToast(`🧪 +${item.amount} Kg pupuk`);
          break;
        case 'instant':
          if (state.level >= 5) {
            showToast('Pohon sudah dewasa, tidak bisa instant.');
            // refund? kita batalkan saja
            state.diamond += 25;
            updateUI();
            return;
          }
          addExp(500);
          showToast(`✨ +500 Exp`);
          break;
        case 'skip':
          if (state.level >= 5) {
            showToast('Tidak bisa skip.');
            return;
          }
          // Naik satu level: set exp ke min level berikutnya
          const nextLevel = Math.min(state.level + 1, 5);
          const targetLevelData = LEVELS.find(l => l.level === nextLevel);
          if (targetLevelData) {
            state.exp = targetLevelData.min; // langsung ke batas bawah level berikutnya
            state.level = nextLevel;
            state.skipUsedThisLevel = true;
            // reset hitungan pupuk? tidak harus, biarkan
            showToast(`⏩ Skip ke Lv.${nextLevel} ${targetLevelData.name}`);
          }
          break;
      }

      updateUI();
    }

    // ========== NAVIGATION ==========
    function switchPage(pageId) {
      pageTanam.classList.remove('active');
      pageToko.classList.remove('active');
      pageAkun.classList.remove('active');

      if (pageId === 'tanam') pageTanam.classList.add('active');
      else if (pageId === 'toko') pageToko.classList.add('active');
      else if (pageId === 'akun') pageAkun.classList.add('active');

      navItems.forEach(item => {
        if (item.dataset.page === pageId) item.classList.add('active');
        else item.classList.remove('active');
      });

      // Refresh shop saat pindah ke toko
      if (pageId === 'toko') renderShop();
    }

    // ========== EDIT NAME ==========
    function editName() {
      const newName = prompt('Masukkan nama petani:', state.name);
      if (newName && newName.trim() !== '') {
        state.name = newName.trim().substring(0, 15);
        updateUI();
        showToast(`Nama diubah menjadi ${state.name}`);
      }
    }

    // ========== INIT ==========
    function init() {
      // Set data awal
      state.water = 0;
      state.fertilizer = 0;
      state.money = 1500;
      state.diamond = 0;
      state.exp = 0;
      state.level = 1;
      state.waterSinceFertilizer = 0;
      state.skipUsedThisLevel = false;

      // Render toko pertama kali
      renderShop();
      updateUI();

      // Event listener
      waterBtn.addEventListener('click', waterTree);
      fertilizeBtn.addEventListener('click', fertilizeTree);
      harvestBtn.addEventListener('click', harvest);
      editNameBtn.addEventListener('click', editName);

      navItems.forEach(item => {
        item.addEventListener('click', () => {
          switchPage(item.dataset.page);
        });
      });

      // Cegah zoom / scroll aneh di mobile
      document.addEventListener('touchmove', (e) => {
        if (e.target.closest('main')) return;
        e.preventDefault();
      }, { passive: false });
    }

    init();
  })();
</script>
</body>
</html>
